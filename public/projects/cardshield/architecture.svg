<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080" role="img" aria-label="CardShield architecture: offline training with MLflow, FastAPI serving with SHAP reasons, and drift monitoring">
<title>CardShield architecture: offline training with MLflow, FastAPI serving with SHAP reasons, and drift monitoring</title>
